name: DropsiftMobile
options:
  bundleIdPrefix: com.elchiapp
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MLH5T4W793
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 2026090302
    MARKETING_VERSION: 1.0.45
packages:
  DropsiftShared:
    path: ../Shared
targets:
  DropsiftMobile:
    type: application
    platform: iOS
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: DropSift
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: DropSift records voice messages you choose to capture.
        NSPhotoLibraryUsageDescription: DropSift imports images you select into your knowledge library.
        NSSpeechRecognitionUsageDescription: DropSift transcribes your voice messages on this device.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: iOS
      - path: Assets/MobileAssets.xcassets
    dependencies:
      - package: DropsiftShared
        product: DropsiftShared
      - target: DropsiftWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elchiapp.dropsift.mobile
        PRODUCT_NAME: DropSift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: Dropsift Mobile App Store 2026073002
  DropsiftWatch:
    type: application
    platform: watchOS
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: DropSift
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: DropSift records voice messages you choose to capture.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        WKCompanionAppBundleIdentifier: com.elchiapp.dropsift.mobile
    sources:
      - path: Watch
      - path: Assets/WatchAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elchiapp.dropsift.mobile.watchkitapp
        PRODUCT_NAME: DropSift Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: Dropsift Watch App Store 2026073002
schemes:
  DropsiftMobile:
    build:
      targets:
        DropsiftMobile: all
        DropsiftWatch: all
    run:
      config: Debug
    archive:
      config: Release
  DropsiftWatch:
    build:
      targets:
        DropsiftWatch: all
    run:
      config: Debug
