<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>DropSift — QVAC recall</title>
  <desc>A teal QVAC-inspired Q and layered memory cards on charcoal. Capture information and bring it back into focus.</desc>
  <defs>
    <linearGradient id="tile" x1="160" y1="80" x2="820" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263B39"/>
      <stop offset="0.48" stop-color="#111C1D"/>
      <stop offset="1" stop-color="#080E11"/>
    </linearGradient>
    <linearGradient id="mint" x1="258" y1="322" x2="742" y2="654" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6BF4CF"/>
      <stop offset="1" stop-color="#00D6BD"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#tile)"/>
  <rect x="73" y="73" width="878" height="878" rx="201" fill="none" stroke="#8DCCC0" stroke-opacity="0.18" stroke-width="3"/>
  <!-- Quiet layers suggest retained notes, documents and conversations. -->
  <path d="M322 278H614" fill="none" stroke="#68EAD0" stroke-opacity="0.28" stroke-width="24" stroke-linecap="round"/>
  <path d="M292 330H644" fill="none" stroke="#68EAD0" stroke-opacity="0.54" stroke-width="24" stroke-linecap="round"/>
  <!-- A strong Q: its sloped shoulder and tail echo the QVAC family. -->
  <path fill="url(#mint)" fill-rule="evenodd" d="M316 382H638C670 382 688 393 706 419L768 508C777 521 772 538 757 544L703 565L789 671H681L614 586H316C270 586 238 554 238 509V459C238 414 270 382 316 382ZM326 454C315 454 308 461 308 472V496C308 507 315 514 326 514H659L626 466C620 457 614 454 602 454Z"/>
  <path d="M326 731H548" fill="none" stroke="#9FBDB7" stroke-opacity="0.50" stroke-width="15" stroke-linecap="round"/>
</svg>
